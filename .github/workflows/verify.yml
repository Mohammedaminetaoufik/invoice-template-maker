name: Main branch checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: main-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-browser:
    name: TypeScript, PDF, static export, browser, Cloudflare dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate types, tests, build and static SEO
        run: npm run check
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Exercise invoice workflows in Chromium
        run: npm run test:browser
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            tmp/playwright/
            tmp/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Cloudflare package without publishing
        run: npx --yes wrangler@4.150.0 deploy --dry-run --config wrangler.jsonc
